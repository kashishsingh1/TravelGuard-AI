name: TravelGuard AI — Autonomous QA & Release Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  autonomous-qa:
    name: Autonomous Test Intelligence & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      PYTHONPATH: .:backend
      TRAVELGUARD_HEALING_MODE: AUTO

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mcp opentelemetry-api opentelemetry-sdk prometheus-client pytest pytest-asyncio

      - name: Install Frontend & Test Dependencies
        run: |
          cd frontend && npm ci
          cd ../tests && npm ci
          npx playwright install --with-deps chromium

      - name: Run Unit & Intelligence Test Suites
        run: |
          python -m pytest travelguard/tests backend/tests -v

      - name: Start SkyBook Application (SUT)
        run: |
          # Start Backend in background
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          # Start Frontend in background
          cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 &
          # Wait for health check
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/api/health | grep "ok"; do sleep 1; done'
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5173 > /dev/null; do sleep 1; done'

      - name: Run TravelGuard Autonomous QA Pipeline
        run: |
          python -m travelguard autonomous-run --quality-gate

      - name: Upload Quality Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelguard-quality-report
          path: |
            artifacts/quality/
            artifacts/runs/
            artifacts/healing/
